name: Publish presentations

on:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-presentations
  cancel-in-progress: true

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Typst
        uses: typst-community/setup-typst@v4

      - name: Build all presentations
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist

          mapfile -d '' presentations < <(
            find . -type f -name main.typ \
              -not -path './.git/*' \
              -print0
          )

          if (( ${#presentations[@]} == 0 )); then
            echo "No presentations (main.typ) found."
            exit 1
          fi

          for source in "${presentations[@]}"; do
            dir="$(dirname "$source")"
            relative="${dir#./}"
            name="${relative//\//-}"

            if [[ -z "$name" || "$name" == "." ]]; then
              name="presentation"
            fi

            output="dist/${name}.pdf"
            echo "Building $source -> $output"
            typst compile --root . "$source" "$output"
          done

          echo "Built release assets:"
          ls -lh dist/*.pdf

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: presentations
          path: dist/*.pdf
          if-no-files-found: error
          overwrite: true

      - name: Update latest release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          if gh release view latest >/dev/null 2>&1; then
            echo "Updating existing latest release"
          else
            echo "Creating latest release"
            gh release create latest \
              --title "Latest presentations" \
              --notes "Automatically rebuilt from the latest master commit."
          fi

          gh release upload latest dist/*.pdf --clobber
