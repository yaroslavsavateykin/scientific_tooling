name: Publish presentations

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Typst
        uses: typst-community/setup-typst@v4

      - name: Build all presentations
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist

          mapfile -d '' presentations < <(
            find . -type f -name main.typ \
              -not -path './.git/*' \
              -print0
          )

          if (( ${#presentations[@]} == 0 )); then
            echo "No presentations (main.typ) found."
            exit 1
          fi

          for source in "${presentations[@]}"; do
            dir="$(dirname "$source")"
            relative="${dir#./}"
            name="${relative//\//-}"

            if [[ -z "$name" || "$name" == "." ]]; then
              name="presentation"
            fi

            output="dist/${name}.pdf"
            echo "Building $source -> $output"
            typst compile --root . "$source" "$output"
          done

          echo "Built release assets:"
          ls -lh dist/*.pdf

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: presentations
          path: dist/*.pdf
          if-no-files-found: error

      - name: Publish PDFs to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.pdf
          generate_release_notes: true
